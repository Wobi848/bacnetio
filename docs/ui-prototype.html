<style>
/* Layout: phone-first single column; one screen at a time; the main action sits in a bottom bar in thumb reach. */
:root {
  --bg: #eef1f8;
  --surface: #ffffff;
  --raised: #f6f8fd;
  --ink: #0f1630;
  --muted: #5b6482;
  --line: #d9deec;
  --accent: #2448e0;
  --accent-ink: #ffffff;
  --accent-soft: #e2e8ff;
  --ring: rgb(36 72 224 / .28);
  --ok: #138a5b;
  --ok-soft: #dcf3e9;
  --warn: #9a5a00;
  --warn-soft: #fff0d1;
  --bad: #c42b1c;
  --bad-soft: #fde4e1;
  --held: #7a3fd1;
  --held-soft: #efe5ff;
  --proto: #6e5d16;
  --proto-soft: #f6efcf;
  --font-ui: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-data: "JetBrains Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a0f1f; --surface: #121a31; --raised: #18213c; --ink: #e8ecfa; --muted: #95a0c2; --line: #243055;
    --accent: #7d95ff; --accent-ink: #0a0f1f; --accent-soft: #1d2a57; --ring: rgb(125 149 255 / .30);
    --ok: #4fd29b; --ok-soft: #10342a; --warn: #ffbe55; --warn-soft: #3a2a0c; --bad: #ff8577; --bad-soft: #3d1714;
    --held: #c9a5ff; --held-soft: #2c1f4d; --proto: #e1cd7c; --proto-soft: #29250f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a0f1f; --surface: #121a31; --raised: #18213c; --ink: #e8ecfa; --muted: #95a0c2; --line: #243055;
  --accent: #7d95ff; --accent-ink: #0a0f1f; --accent-soft: #1d2a57; --ring: rgb(125 149 255 / .30);
  --ok: #4fd29b; --ok-soft: #10342a; --warn: #ffbe55; --warn-soft: #3a2a0c; --bad: #ff8577; --bad-soft: #3d1714;
  --held: #c9a5ff; --held-soft: #2c1f4d; --proto: #e1cd7c; --proto-soft: #29250f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 120px;
}
button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* prototype controls, deliberately outside the app */
.proto {
  max-width: 640px; margin: 10px auto 0; padding: 6px 10px; border: 1px dashed var(--proto);
  background: var(--proto-soft); color: var(--proto); border-radius: 10px; display: flex; flex-wrap: wrap;
  gap: 6px; align-items: center; font-size: 12px;
}
.proto strong { letter-spacing: .08em; text-transform: uppercase; font-size: 10px; margin-right: 4px; }
.proto button { border: 1px solid var(--proto); background: transparent; border-radius: 999px; padding: 2px 9px; font-size: 12px; color: var(--proto); }
.proto button[aria-pressed="true"] { background: var(--proto); color: var(--proto-soft); }

.app { max-width: 640px; margin: 0 auto; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 6px;
  min-height: 58px; background: var(--bg);
}
.bar h1 { flex: 1; min-width: 0; margin: 0; font-size: 19px; font-weight: 700; font-stretch: 110%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wordmark { flex: 1; font-weight: 800; font-size: 20px; font-stretch: 120%; letter-spacing: -.01em; }
.wordmark span { color: var(--accent); }
.icon-btn { border: 0; background: var(--surface); width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); flex: none; box-shadow: 0 1px 0 var(--line); }
.icon-btn svg { width: 22px; height: 22px; }
.held-pill { border: 0; background: var(--held); color: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; flex: none; }

/* bottom action bar */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 8;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.dock-inner { max-width: 640px; margin: 0 auto; display: grid; gap: 10px; }
.primary {
  width: 100%; border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 17px 20px;
  font-size: 18px; font-weight: 700; font-stretch: 108%; box-shadow: 0 8px 24px var(--ring);
}
.primary:active { transform: translateY(1px); }
.secondary { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 14px 18px; font-weight: 600; }
.link { border: 0; background: none; color: var(--accent); padding: 0; font-weight: 600; }

/* sonar */
.sonar { position: relative; width: 220px; height: 220px; display: grid; place-items: center; margin: 0 auto; }
.sonar i { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--ring); }
.sonar i:nth-child(2) { inset: 30px; }
.sonar i:nth-child(3) { inset: 60px; }
.sonar.live i { animation: pulse 2.4s ease-out infinite; }
.sonar.live i:nth-child(2) { animation-delay: .8s; }
.sonar.live i:nth-child(3) { animation-delay: 1.6s; }
@keyframes pulse { 0% { transform: scale(.55); opacity: 1; } 100% { transform: scale(1.08); opacity: 0; } }
.sonar .core { position: relative; width: 84px; height: 84px; border-radius: 26px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; box-shadow: 0 10px 30px var(--ring); }
.sonar .core svg { width: 40px; height: 40px; }
.sonar .count { font-family: var(--font-data); font-size: 34px; font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .sonar.live i { animation: none; } }

/* start */
.start { display: grid; gap: 22px; padding-block: 28px 8px; text-align: center; }
.start h2 { margin: 0; font-size: 34px; line-height: 1.05; font-weight: 800; font-stretch: 112%; text-wrap: balance; }
.start p { margin: 0 auto; color: var(--muted); max-width: 34ch; }
.adapter {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px 14px;
  display: grid; grid-template-columns: auto 1fr auto; gap: 2px 12px; align-items: center; text-align: left;
}
.adapter .plug { grid-row: span 2; width: 40px; height: 40px; border-radius: 12px; background: var(--ok-soft); color: var(--ok); display: grid; place-items: center; }
.adapter .plug svg { width: 22px; height: 22px; }
.adapter .t { font-weight: 700; }
.adapter .s { color: var(--muted); font-size: 13px; }
.adapter .c { grid-row: span 2; color: var(--accent); font-weight: 600; font-size: 14px; }

/* search header */
.search-head { display: grid; justify-items: center; gap: 6px; padding-block: 8px 18px; text-align: center; }
.search-head .sonar { width: 150px; height: 150px; }
.search-head .sonar i:nth-child(2) { inset: 20px; }
.search-head .sonar i:nth-child(3) { inset: 40px; }
.search-head .sonar .core { width: 74px; height: 74px; border-radius: 24px; }
.search-head .label { font-weight: 700; font-size: 18px; }
.search-head .phase { color: var(--muted); font-size: 14px; max-width: 34ch; }

/* device cards */
.cards { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.card-btn {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; text-align: left;
  animation: rise .35s ease-out both;
}
@keyframes rise { from { transform: translateY(6px); opacity: .4; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .card-btn { animation: none; } }
.badge { grid-row: span 2; width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 15px; font-stretch: 115%; }
.card-btn .name { font-weight: 700; font-size: 17px; min-width: 0; overflow-wrap: anywhere; }
.card-btn .sub { color: var(--muted); font-size: 13px; min-width: 0; overflow-wrap: anywhere; }
.card-btn .side { grid-row: span 2; display: grid; justify-items: end; gap: 4px; }
.card-btn .id { font-family: var(--font-data); font-size: 13px; color: var(--muted); }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .03em; border-radius: 999px; padding: 2px 8px; background: var(--raised); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }

.note { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; padding: 14px; border-radius: 16px; background: var(--accent-soft); margin-bottom: 14px; }
.note .ico { grid-row: span 2; width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; }
.note b { font-weight: 700; }
.note span { color: var(--muted); font-size: 14px; }

.empty { display: grid; gap: 14px; padding-block: 20px; text-align: center; justify-items: center; }
.empty .x { width: 84px; height: 84px; border-radius: 26px; background: var(--warn-soft); color: var(--warn); display: grid; place-items: center; }
.empty .x svg { width: 40px; height: 40px; }
.empty h2 { margin: 0; font-size: 26px; font-weight: 800; font-stretch: 110%; }
.empty p { margin: 0; max-width: 36ch; }
.empty .why { color: var(--muted); }

/* device */
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 6px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-data); font-size: 22px; font-weight: 600; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 600; }
.stat.bad { background: var(--bad-soft); border-color: transparent; }
.stat.bad b, .stat.bad span { color: var(--bad); }
.stat.warn { background: var(--warn-soft); border-color: transparent; }
.stat.warn b, .stat.warn span { color: var(--warn); }
.stat.ok b { color: var(--ok); }
.device-line { color: var(--muted); font-size: 14px; padding-block: 2px 4px; }
.progress { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-block: 8px; }
.progress > div { height: 100%; background: var(--accent); transition: width .2s; }
.group-title { margin: 22px 4px 8px; font-size: 12px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.points { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.points li + li { border-top: 1px solid var(--line); }
.point { width: 100%; border: 0; background: none; text-align: left; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; padding: 13px 14px; align-items: center; }
.point:active { background: var(--raised); }
.point .name { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.point .sub { color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.point .val { grid-row: span 2; font-family: var(--font-data); font-size: 17px; font-weight: 600; text-align: right; white-space: nowrap; }
.point .val small { font-size: 13px; color: var(--muted); font-weight: 400; margin-left: 3px; }
.point .meter { grid-column: 1 / -1; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 4px; }
.point .meter > div { height: 100%; background: var(--accent); }
.state { display: inline-block; font-family: var(--font-ui); font-size: 14px; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: var(--raised); color: var(--muted); }
.state.on { background: var(--ok-soft); color: var(--ok); }
.chip { font-size: 11px; font-weight: 800; border-radius: 999px; padding: 1px 7px; white-space: nowrap; letter-spacing: .02em; }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.held { background: var(--held-soft); color: var(--held); }

/* object */
.hero { display: grid; gap: 10px; padding: 22px 18px; margin-top: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; }
.hero .kind { color: var(--muted); font-size: 13px; font-weight: 600; }
.big { font-family: var(--font-data); font-size: 56px; line-height: 1; font-weight: 600; letter-spacing: -.02em; }
.big small { font-size: 22px; color: var(--muted); font-weight: 400; margin-left: 8px; }
.big.word { font-family: var(--font-ui); font-size: 44px; font-weight: 800; font-stretch: 112%; }
.hero .meter { height: 8px; border-radius: 8px; background: var(--line); overflow: hidden; }
.hero .meter > div { height: 100%; background: var(--accent); transition: width .3s; }
.hero .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 14px; margin-top: 12px; }
.panel h3 { margin: 0; font-size: 16px; font-weight: 700; }
.panel p { margin: 0; color: var(--muted); font-size: 14px; }
.props { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 10px 14px; margin: 0; font-size: 15px; }
.props dt { color: var(--muted); }
.props dd { margin: 0; overflow-wrap: anywhere; }
.stack { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.stack li { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 12px; background: var(--raised); }
.stack .n { font-family: var(--font-data); font-weight: 600; color: var(--muted); text-align: center; }
.stack .v { font-family: var(--font-data); font-weight: 600; }
.stack .who { font-size: 12px; color: var(--muted); font-weight: 600; }
.stack li.win { background: var(--accent-soft); outline: 2px solid var(--accent); outline-offset: -2px; }
.stack li.win .n { color: var(--accent); }
.stack li.mine { background: var(--held-soft); }
.stack li.mine.win { outline-color: var(--held); }
.form { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.form label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; }
.form input, .form select { font: inherit; font-size: 17px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); color: var(--ink); min-width: 0; width: 100%; }
.warn-box { display: grid; gap: 8px; padding: 14px; border-radius: 16px; background: var(--warn-soft); }
.warn-box b { color: var(--warn); }

/* sheet */
.scrim { position: fixed; inset: 0; background: rgb(5 8 20 / .45); z-index: 20; display: grid; align-items: end; justify-items: center; }
.sheet {
  width: min(640px, 100%); background: var(--surface); border-radius: 24px 24px 0 0;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 12px; max-height: 85vh; overflow-y: auto;
}
.sheet .grip { width: 40px; height: 5px; border-radius: 5px; background: var(--line); justify-self: center; }
.sheet h2 { margin: 0; font-size: 20px; font-weight: 800; font-stretch: 110%; }
.opt { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left; border: 1px solid var(--line); background: var(--raised); border-radius: 14px; padding: 13px 14px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt .sub { color: var(--muted); font-size: 13px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 600; }
.field input { font: inherit; font-size: 17px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--raised); color: var(--ink); }
.hint { color: var(--muted); font-size: 13px; margin: 0; }
.held-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; padding: 12px; border-radius: 14px; background: var(--held-soft); }
.held-row .s { font-size: 13px; color: var(--muted); }
.held-row button { grid-row: span 2; border: 0; background: var(--held); color: var(--surface); border-radius: 12px; padding: 8px 12px; font-weight: 700; }

.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 14px; z-index: 30; font-size: 14px; font-weight: 600; max-width: calc(100% - 32px); }
</style>

    { t: "AO", i: 2, name: "Heating valve", value: 35, unit: "%", commandable: true, def: 0, prio: { 16: 35 }, desc: "Valve heating coil" },
    { t: "BO", i: 1, name: "Supply fan enable", binary: true, value: 1, on: "On", off: "Off", commandable: true, def: 0, prio: { 16: 1 }, desc: "Fan release" },
    { t: "AV", i: 1, name: "Supply air setpoint", value: 20, unit: "°C", commandable: true, def: 20, prio: {}, desc: "Setpoint supply air temperature" },
    { t: "MSV", i: 1, name: "Operating mode", multi: ["Off", "Auto", "Comfort", "Economy"], value: 2, commandable: true, def: 2, prio: {}, desc: "Plant operating mode" },
    { t: "SCH", i: 1, name: "Occupancy schedule", text: "Occupied", desc: "Mon–Fri 06:00–18:00" },
    { t: "TL", i: 1, name: "Supply air temp log", text: "1440 records", desc: "Every minute" },
  ];
}
function boilerObjects() {
  return [
    { t: "AI", i: 1, name: "Flow temp", value: 68.5, unit: "°C", desc: "Boiler flow" },
    { t: "AI", i: 2, name: "Return temp", value: 51.2, unit: "°C", desc: "Boiler return" },
    { t: "BI", i: 1, name: "Burner fault", binary: true, value: 0, on: "Fault", off: "Normal", desc: "Burner lockout" },
    { t: "AO", i: 1, name: "Pump speed", value: 80, unit: "%", commandable: true, def: 0, prio: { 8: 80, 16: 55 }, status: ["overridden"], who8: "someone else", desc: "Primary pump" },
    { t: "AV", i: 1, name: "Flow setpoint", value: 70, unit: "°C", commandable: true, def: 70, prio: {}, desc: "Heating curve result" },
  ];
}
function vavObjects(n) {
  return [
    { t: "AI", i: 1, name: "Room temp", value: 21.9 + n / 10, unit: "°C", desc: "Room sensor" },
    { t: "AI", i: 2, name: "Airflow", value: 180 + n * 12, unit: "m³/h", desc: "Measured airflow" },
    { t: "AO", i: 1, name: "Damper", value: 40 + n * 3, unit: "%", commandable: true, def: 0, prio: { 16: 40 + n * 3 }, desc: "VAV damper" },
    { t: "AV", i: 1, name: "Room setpoint", value: 22, unit: "°C", commandable: true, def: 22, prio: {}, desc: "Occupied setpoint" },
  ];
}
const ALL_DEVICES = [
  { id: 1001, name: "AHU-01", vendor: "Siemens", model: "PXC5.E003", ip: "192.168.10.20", objects: ahuObjects },
  { id: 1002, name: "AHU-02", vendor: "Siemens", model: "PXC5.E003", ip: "192.168.10.21", objects: ahuObjects },
  { id: 2040, name: "Boiler room", vendor: "Sauter", model: "EY-modulo 5", ip: "192.168.10.31", objects: boilerObjects },
  { id: 5000, name: "Router floor 2", vendor: "Contemporary Controls", model: "BASrouter", ip: "192.168.10.5", objects: () => [] },
  ...[1, 2, 3, 4].map((n) => ({
    id: 20100 + n, name: `VAV 2.0${n}`, vendor: "Belimo", model: "VAV-Compact", ip: "192.168.10.5",
    route: { net: 5, mac: n + 10 }, objects: () => vavObjects(n),
  })),
];

let state;
let timers = [];
function later(ms, fn) { timers.push(setTimeout(fn, ms)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }
function reset() {
  state = {
    scenario: state?.scenario ?? "normal", screen: "start", adapter: ADAPTERS[0], devices: [], phase: "idle",
    device: null, objects: [], loaded: 0, object: null, writeUnlocked: false, asking: false, held: [],
    sheet: null, technical: false, bbmd: "",
  };
  clearTimers();
  render();
}

const h = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const key = (d, o) => `${d.id}:${o.t}${o.i}`;
const num = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(1));
const initials = (v) => v.split(/\s+/).map((w) => w[0]).join("").slice(0, 2).toUpperCase();
function wordValue(o) {
  if (o.binary) return o.value ? o.on : o.off;
  if (o.multi) return o.multi[o.value - 1];
  return o.text;
}
function fmt(o, v) {
  if (o.binary) return v ? o.on : o.off;
  if (o.multi) return o.multi[v - 1];
  return `${num(v)} ${o.unit}`;
}
function heldBy(o) { return state.held.find((x) => x.key === key(state.device, o)); }
function chipList(o) {
  const out = [];
  if (heldBy(o)) out.push('<span class="chip held">HELD BY YOU</span>');
  for (const s of o.status || []) {
    if (s === "fault") out.push('<span class="chip bad">FAULT</span>');
    if (s === "overridden") out.push('<span class="chip warn">OVERRIDDEN</span>');
  }
  return out.join("");
}

/* ---------- screens ---------- */
function bar(title, { back = true } = {}) {
  const held = state.held.length ? `<button class="held-pill" data-act="held">${state.held.length} held</button>` : "";
  const head = back
    ? `<button class="icon-btn" data-act="back" aria-label="Back">${ICONS.back}</button><h1>${h(title)}</h1>`
    : `<div class="wordmark">bacnet<span>io</span></div>`;
  return `<div class="bar">${head}${held}<button class="icon-btn" data-act="more" aria-label="More">${ICONS.more}</button></div>`;
}

function viewStart() {
  const a = state.adapter;
  return {
    html: `${bar("", { back: false })}
    <section class="start">
      <div class="sonar"><i></i><i></i><i></i><div class="core">${ICONS.net}</div></div>
      <h2>Find BACnet devices</h2>
      <p>bacnetio asks the network who is there. Nothing in the plant is changed.</p>
      <button class="adapter" data-act="adapter">
        <span class="plug">${ICONS[a.icon]}</span><span class="t">${h(a.name)}</span>
        <span class="c">Change</span><span class="s mono">${a.ip}/${a.prefix}</span>
      </button>
    </section>`,
    dock: `<button class="primary" data-act="find">Find devices</button>`,
  };
}

function viewDevices() {
  const n = state.devices.length;
  const searching = state.phase !== "done";
  if (!searching && n === 0) return emptyDevices();
  const phase = {
    whois: "Asking the network who is there",
    sweep: "No broadcast answers. Asking each of the 253 addresses directly",
    done: state.scenario === "firewall" ? "Found by asking each address" : "Search finished",
  }[state.phase];
  const head = `<div class="search-head">
    <div class="sonar ${searching ? "live" : ""}"><i></i><i></i><i></i><div class="core"><span class="count">${n}</span></div></div>
    <div class="label">${n === 1 ? "1 device" : `${n} devices`}</div>
    <div class="phase">${phase}${searching ? " …" : ""}</div></div>`;
  const note = !searching && state.scenario === "firewall"
    ? `<div class="note"><span class="ico">i</span><b>Broadcast answers are blocked here.</b>
       <span>Usually the firewall, common without administrator rights. The list is still complete.</span></div>` : "";
  const cards = state.devices.map((d) => `<li><button class="card-btn" data-act="device" data-id="${d.id}">
      <span class="badge" style="background:hsl(${VENDOR_HUES[d.vendor] ?? 220} 60% 42%)">${initials(d.vendor)}</span>
      <span class="name">${h(d.name)}</span>
      <span class="side"><span class="id">#${d.id}</span>${d.route ? `<span class="tag">NET ${d.route.net}</span>` : ""}</span>
      <span class="sub">${h(d.vendor)} · ${d.route ? `behind router ${d.ip}` : `<span class="mono">${d.ip}</span>`}</span>
    </button></li>`).join("");
  return {
    html: `${bar("Devices")}${head}${note}<ul class="cards">${cards}</ul>`,
    dock: searching ? "" : `<button class="secondary" data-act="export-devices">Export device list</button>`,
  };
}

function emptyDevices() {
  return {
    html: `${bar("Devices")}<section class="empty">
      <div class="x">${ICONS.none}</div>
      <h2>No device answered</h2>
      <p>Not to the broadcast, and not when each address on <span class="mono">${state.adapter.ip}/${state.adapter.prefix}</span> was asked directly.</p>
      <p class="why">Most likely this is the wrong network: another adapter, another VLAN, or the plant uses another subnet.</p>
      <button class="link" data-act="advanced">Search another subnet</button>
    </section>`,
    dock: `<button class="primary" data-act="adapter">Choose another adapter</button>`,
  };
}

function viewDevice() {
  const d = state.device;
  const total = state.objects.length;
  const shown = state.objects.slice(0, state.loaded);
  const reading = state.loaded < total;
  if (!total) {
    return {
      html: `${bar(d.name)}<section class="empty"><div class="x">${ICONS.net}</div><h2>This is a router</h2>
        <p class="why">It has no data points itself. The devices behind it are in the device list.</p></section>`,
      dock: "",
    };
  }
  const faults = shown.filter((o) => (o.status || []).includes("fault")).length;
  const overridden = shown.filter((o) => (o.status || []).includes("overridden") || heldBy(o)).length;
  const summary = `<div class="summary">
    <div class="stat"><b>${state.loaded}</b><span>DATA POINTS</span></div>
    <div class="stat ${faults ? "bad" : "ok"}"><b>${faults}</b><span>${faults === 1 ? "FAULT" : "FAULTS"}</span></div>
    <div class="stat ${overridden ? "warn" : "ok"}"><b>${overridden}</b><span>OVERRIDDEN</span></div></div>`;
  const line = reading
    ? `<div class="progress"><div style="width:${(state.loaded / total) * 100}%"></div></div>`
    : `<div class="device-line">${h(d.vendor)} ${h(d.model)} · <span class="mono">#${d.id}</span></div>`;
  let body = "";
  for (const [title, types] of GROUPS) {
    const items = shown.filter((o) => types.includes(o.t));
    if (!items.length) continue;
    body += `<h2 class="group-title">${title}</h2><ul class="points">${items.map((o) => {
      const word = wordValue(o);
      const val = word !== undefined
        ? `<span class="state ${o.binary && o.value ? "on" : ""}">${h(word)}</span>`
        : `${num(o.value)}<small>${h(o.unit)}</small>`;
      const meter = o.unit === "%" ? `<span class="meter"><div style="width:${o.value}%"></div></span>` : "";
      return `<li><button class="point" data-act="object" data-key="${key(d, o)}">
        <span class="name">${h(o.name)}</span><span class="val">${val}</span>
        <span class="sub">${TYPE_NAMES[o.t]} ${o.i} ${chipList(o)}</span>${meter}</button></li>`;
    }).join("")}</ul>`;
  }
  return {
    html: `${bar(d.name)}${summary}${line}${body}`,
    dock: reading ? "" : `<button class="secondary" data-act="export-points">Export data points</button>`,
  };
}

function viewObject() {
  const d = state.device, o = state.object;
  const word = wordValue(o);
  const value = word !== undefined
    ? `<div class="big word">${h(word)}</div>`
    : `<div class="big">${num(o.value)}<small>${h(o.unit)}</small></div>`;
  const meter = o.unit === "%" ? `<div class="meter"><div style="width:${o.value}%"></div></div>` : "";
  const chips = chipList(o);
  const props = [
    ["Description", o.desc],
    ["Status", (o.status || []).length ? o.status.join(", ") : "Normal"],
    ["Reliability", o.reliability || "No fault detected"],
    ["Out of service", "No"],
  ];
  if (o.unit) props.push(["Unit", o.unit]);
  const tech = state.technical ? `<dl class="props mono">
      <dt>object</dt><dd>${TYPE_NAMES[o.t].toLowerCase().replace(/ /g, "-")},${o.i}</dd>
      <dt>present-value</dt><dd>${o.binary ? (o.value ? "active (1)" : "inactive (0)") : o.value}</dd>
      <dt>device</dt><dd>${d.id} @ ${d.route ? `net ${d.route.net} mac ${d.route.mac} via ${d.ip}` : d.ip + ":47808"}</dd></dl>` : "";
  const write = o.commandable ? writePanel(o) : { html: "", dock: "" };
  return {
    html: `${bar(o.name)}
      <section class="hero"><span class="kind">${TYPE_NAMES[o.t]} ${o.i} · ${h(d.name)}</span>${value}${meter}
        ${chips ? `<div class="chips">${chips}</div>` : ""}</section>
      ${write.html}
      <div class="panel"><h3>Details</h3>
        <dl class="props">${props.map(([k, v]) => `<dt>${k}</dt><dd>${h(v)}</dd>`).join("")}</dl>
        <button class="link" data-act="technical">${state.technical ? "Hide" : "Show"} technical details</button>${tech}</div>`,
    dock: write.dock,
  };
}

function writePanel(o) {
  const mine = heldBy(o);
  const entries = Object.entries(o.prio).map(([p, v]) => [Number(p), v]).sort((a, b) => a[0] - b[0]);
  const winner = entries[0]?.[0];
  const rows = entries.map(([p, v]) => {
    const isMine = mine && mine.priority === p;
    const who = isMine ? "You" : p === 8 && o.who8 ? "Someone else" : PRIORITY_NAMES[p] || "";
    return `<li class="${p === winner ? "win" : ""} ${isMine ? "mine" : ""}"><span class="n">${p}</span>
      <span class="v">${h(fmt(o, v))}</span><span class="who">${h(who)}</span></li>`;
  }).join("");
  const stack = `<div><h3>Who sets this value</h3><p>The lowest number wins. When everything is released, the default applies.</p></div>
    <ul class="stack">${rows}<li class="${entries.length ? "" : "win"}"><span class="n">–</span><span class="v">${h(fmt(o, o.def))}</span><span class="who">Default</span></li></ul>`;

  if (!state.writeUnlocked && !state.asking) {
    return { html: `<div class="panel">${stack}</div>`, dock: `<button class="primary" data-act="ask-write">Change value</button>` };
  }
  if (!state.writeUnlocked) {
    return {
      html: `<div class="panel">${stack}</div>`,
      dock: `<div class="warn-box"><b>Change values in the running plant?</b>
        <span>Changes act at once. Every change is logged, and bacnetio shows what you still hold so you can release it before you leave.</span></div>
        <button class="primary" data-act="unlock">Allow changes for this session</button>
        <button class="secondary" data-act="cancel-write">Cancel</button>`,
    };
  }
  const input = o.binary
    ? `<label>New value<select id="new-value"><option value="1">${h(o.on)}</option><option value="0">${h(o.off)}</option></select></label>`
    : o.multi
      ? `<label>New value<select id="new-value">${o.multi.map((s, i) => `<option value="${i + 1}" ${i + 1 === o.value ? "selected" : ""}>${h(s)}</option>`).join("")}</select></label>`
      : `<label>New value (${h(o.unit)})<input id="new-value" class="mono" inputmode="decimal" value="${num(o.value)}"></label>`;
  return {
    html: `<div class="panel">${stack}<div class="form">${input}
      <label>Priority<select id="priority"><option value="8">8 · Manual operator</option><option value="16">16 · Lowest</option><option value="5">5 · Critical</option></select></label></div></div>`,
    dock: `<button class="primary" data-act="write">Write value</button>${mine ? `<button class="secondary" data-act="release">Release my value (priority ${mine.priority})</button>` : ""}`,
  };
}

/* ---------- sheets ---------- */
function sheetHtml() {
  if (!state.sheet) return "";
  let inner = "";
  if (state.sheet === "adapter") {
    inner = `<h2>Network adapter</h2>${ADAPTERS.map((a, i) => `
      <button class="opt" data-act="pick-adapter" data-i="${i}" aria-pressed="${a === state.adapter}">
        <span>${h(a.name)}</span><span class="mono">${a.ip}</span><span class="sub">${h(a.sub)}</span></button>`).join("")}
      <p class="hint">Pick the one plugged into the plant network.</p>`;
  }
  if (state.sheet === "more") {
    inner = `<h2>More</h2>
      <button class="opt" data-act="find"><span>Search again</span></button>
      <button class="opt" data-act="advanced"><span>Advanced</span><span></span><span class="sub">Other subnets, port, packet console</span></button>
      <button class="opt" data-act="noop"><span>Language</span><span>English</span></button>`;
  }
  if (state.sheet === "advanced") {
    inner = `<h2>Advanced</h2>
      <div class="field"><label for="bbmd">BBMD in another subnet</label><input id="bbmd" class="mono" placeholder="10.20.0.10" value="${h(state.bbmd)}"></div>
      <p class="hint">bacnetio registers there as a foreign device and also finds the devices behind it.</p>
      <div class="field"><label for="port">BACnet port</label><input id="port" class="mono" value="47808" inputmode="numeric"></div>
      <button class="opt" data-act="noop"><span>Packet console</span><span></span><span class="sub">Every BACnet packet, decoded</span></button>
      <button class="primary" data-act="find">Search with these settings</button>`;
  }
  if (state.sheet === "held") {
    inner = `<h2>Values you hold</h2><p class="hint">They stay as you set them until you release them.</p>
      ${state.held.map((x) => `<div class="held-row"><b>${h(x.device)} · ${h(x.name)}</b>
        <button data-act="release-key" data-key="${x.key}">Release</button>
        <span class="s">${h(x.text)} · priority ${x.priority}</span></div>`).join("")}
      <button class="primary" data-act="release-all">Release all</button>`;
  }
  return `<div class="scrim" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>${inner}</div></div>`;
}

let toastTimer;
function toast(text) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = text; document.body.append(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2600);
}

function render() {
  const views = { start: viewStart, devices: viewDevices, device: viewDevice, object: viewObject };
  const view = views[state.screen]();
  document.getElementById("app").innerHTML = view.html + sheetHtml();
  const dock = document.getElementById("dock");
  dock.hidden = !view.dock || Boolean(state.sheet);
  document.getElementById("dock-inner").innerHTML = view.dock || "";
  document.querySelectorAll(".proto [data-scenario]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.scenario === state.scenario)));
}

/* ---------- simulated network ---------- */
function find() {
  clearTimers();
  Object.assign(state, { screen: "devices", devices: [], phase: "whois", sheet: null });
  render();
  const list = state.adapter === ADAPTERS[0] || state.bbmd ? ALL_DEVICES : [];
  if (state.scenario === "nothing" || !list.length) {
    later(1500, () => { state.phase = "sweep"; render(); });
    later(4200, () => { state.phase = "done"; render(); });
    return;
  }
  const firewall = state.scenario === "firewall";
  const start = firewall ? 2000 : 500;
  const step = firewall ? 280 : 220;
  if (firewall) later(1500, () => { state.phase = "sweep"; render(); });
  list.forEach((d, i) => later(start + i * step, () => { state.devices.push(d); render(); }));
  later(start + list.length * step + 800, () => { state.phase = "done"; render(); });
}

function openDevice(id) {
  clearTimers();
  state.device = state.devices.find((x) => x.id === id);
  state.objects = state.device.objects();
  state.loaded = 0;
  state.screen = "device";
  render();
  window.scrollTo(0, 0);
  const step = () => {
    state.loaded = Math.min(state.objects.length, state.loaded + 3);
    if (state.screen === "device") render();
    if (state.loaded < state.objects.length) later(200, step);
  };
  later(200, step);
}

function write() {
  const o = state.object;
  const raw = document.getElementById("new-value").value;
  const priority = Number(document.getElementById("priority").value);
  const v = o.binary || o.multi ? Number(raw) : Number(raw.replace(",", "."));
  if (raw.trim() === "" || Number.isNaN(v)) { toast("Enter a number, for example 21.5"); return; }
  o.prio[priority] = v;
  o.value = o.prio[Math.min(...Object.keys(o.prio).map(Number))];
  const k = key(state.device, o);
  state.held = state.held.filter((x) => x.key !== k);
  state.held.push({ key: k, device: state.device.name, name: o.name, priority, text: fmt(o, v), object: o });
  render();
  toast(`Wrote ${fmt(o, v)} at priority ${priority}`);
}

function release(k) {
  const x = state.held.find((y) => y.key === k);
  if (!x) return;
  delete x.object.prio[x.priority];
  const left = Object.keys(x.object.prio).map(Number);
  x.object.value = left.length ? x.object.prio[Math.min(...left)] : x.object.def;
  state.held = state.held.filter((y) => y.key !== k);
}

document.addEventListener("click", (e) => {
  const scenario = e.target.closest("[data-scenario]");
  if (scenario) { state.scenario = scenario.dataset.scenario; reset(); return; }
  if (e.target.closest("#restart")) { reset(); return; }
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "close-sheet" && e.target !== el) return;
  switch (act) {
    case "find": find(); break;
    case "adapter": state.sheet = "adapter"; render(); break;
    case "pick-adapter": state.adapter = ADAPTERS[Number(el.dataset.i)]; state.sheet = null; if (state.screen === "devices") find(); else render(); break;
    case "more": state.sheet = "more"; render(); break;
    case "advanced": state.sheet = "advanced"; render(); break;
    case "held": state.sheet = "held"; render(); break;
    case "close-sheet": state.sheet = null; render(); break;
    case "noop": toast("Not part of this prototype"); break;
    case "back":
      clearTimers();
      if (state.screen === "object") { state.screen = "device"; state.loaded = state.objects.length; }
      else if (state.screen === "device") state.screen = "devices";
      else { state.screen = "start"; state.phase = "idle"; }
      render(); window.scrollTo(0, 0); break;
    case "device": openDevice(Number(el.dataset.id)); break;
    case "object":
      state.object = state.objects.find((o) => key(state.device, o) === el.dataset.key);
      state.screen = "object"; state.asking = false; state.technical = false; render(); window.scrollTo(0, 0); break;
    case "technical": state.technical = !state.technical; render(); break;
    case "ask-write": state.asking = true; render(); break;
    case "cancel-write": state.asking = false; render(); break;
    case "unlock": state.writeUnlocked = true; render(); break;
    case "write": write(); break;
    case "release": release(key(state.device, state.object)); render(); toast("Released"); break;
    case "release-key": release(el.dataset.key); if (!state.held.length) state.sheet = null; render(); toast("Released"); break;
    case "release-all": [...state.held].forEach((x) => release(x.key)); state.sheet = null; render(); toast("All values released"); break;
    case "export-devices": toast("Saved device list as devices.csv"); break;
    case "export-points": toast(`Saved data points as ${state.device.name}.csv`); break;
  }
});
document.addEventListener("input", (e) => { if (e.target.id === "bbmd") state.bbmd = e.target.value; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.sheet) { state.sheet = null; render(); } });

reset();
</script>
