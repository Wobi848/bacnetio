[package]
name = "bacnetio"
version = "0.3.0"
description = "BACnet browser"
repository = "https://github.com/Wobi848/bacnetio"
license = "MIT"
edition = "2024"

# BACnet/SC (docs/concept-sc.md), in every release; `--no-default-features` builds without it and
# its TLS stack, should that ever not build on a platform
[features]
default = ["sc"]
sc = ["bacnet-transport/sc-tls", "dep:getrandom"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
bacnet-client = "=0.15.0"
bacnet-encoding = "=0.15.0"
bacnet-services = "=0.15.0"
bacnet-transport = "=0.15.0"
bacnet-types = "=0.15.0"
bytes = "1"
clap = { version = "4.6.7", features = ["derive"] }
# bacnetio's own device UUID on BACnet/SC; the version bacnet-transport uses
getrandom = { version = "0.3", optional = true }
if-addrs = "0.15.0"
mime_guess = "2"
rust-embed = "8"
# the Excel exports (workbook.rs, docs/concept-excel.md)
rust_xlsxwriter = "0.102.0"
# the check for a new release (update.rs): ring as in mbusio, so no system TLS on any platform
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
bacnet-objects = "=0.15.0"
bacnet-server = { version = "=0.15.0", features = ["sc-tls"] }
# certificates for the hub and devices the SC tests make
rcgen = "0.14"
tower = { version = "0.5", features = ["util"] }
# opens the Excel files again in tests; the version rust_xlsxwriter writes them with
zip = { version = "9", default-features = false, features = ["deflate"] }

# simulated_mstp: clears the exclusive mark a killed bacnetio leaves on its pseudo-terminal
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1

# MS/TP over a serial port (docs/concept-mstp.md): Windows and Linux; Android has no serial port
[target.'cfg(not(target_os = "android"))'.dependencies]
bacnet-transport = { version = "=0.15.0", features = ["serial"] }
# the adapter's own name for the port list; the version bacnet-transport uses
tokio-serial = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
