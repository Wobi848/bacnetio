[package]
name = "bacnetio"
version = "0.1.0"
description = "BACnet browser"
license = "MIT"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
bacnet-client = "=0.15.0"
bacnet-encoding = "=0.15.0"
bacnet-services = "=0.15.0"
bacnet-transport = "=0.15.0"
bacnet-types = "=0.15.0"
bytes = "1"
clap = { version = "4.6.7", features = ["derive"] }
if-addrs = "0.15.0"
mime_guess = "2"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[dev-dependencies]
bacnet-objects = "=0.15.0"
bacnet-server = "=0.15.0"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
strip = true
codegen-units = 1

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
